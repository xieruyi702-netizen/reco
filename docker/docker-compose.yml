services:
  # 双实例水平扩展（x-app 共享配置）：
  # - Kafka 消费者组按分区自动分配（topic 2 分区 → 两实例并行消费）
  # - 延迟取消扫描经 Redis 分布式锁互斥
  # - 本地消息表中继双实例可能重复投递，由消费端 INSERT IGNORE 幂等吸收
  # - 令牌桶为实例内存态，集群总限流 = 单实例配置 × 实例数（如需全局限流另上 Redis+Lua）
  x-app: &app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment: &app-env
      SPRING_PROFILES_ACTIVE: docker
      SECKILL_KAFKA_PARTITIONS: 2
    depends_on:
      mysql:
        condition: service_healthy
      redis-master:
        condition: service_started
      redis-replica-1:
        condition: service_started
      redis-replica-2:
        condition: service_started
      kafka:
        condition: service_started

  app1:
    <<: *app
    container_name: seckill-app1

  app2:
    <<: *app
    container_name: seckill-app2

  # 负载均衡：外部统一走 8080，轮询分发到 app1/app2
  nginx:
    image: nginx:1.27-alpine
    container_name: seckill-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

  mysql:
    image: mysql:8.4
    container_name: seckill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: seckill
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-master:
    image: redis:7.4
    container_name: seckill-redis-master
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  redis-replica-1:
    image: redis:7.4
    container_name: seckill-redis-replica-1
    ports:
      - "6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--replicaof", "redis-master", "6379"]
    depends_on:
      - redis-master

  redis-replica-2:
    image: redis:7.4
    container_name: seckill-redis-replica-2
    ports:
      - "6381:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--replicaof", "redis-master", "6379"]
    depends_on:
      - redis-master

  kafka:
    image: apache/kafka:3.8.0
    container_name: seckill-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
