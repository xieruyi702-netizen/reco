events {
    worker_connections 1024;
}

http {
    upstream seckill_app {
        # 轮询（默认策略）；server_weight 可加权
        # max_fails/fail_timeout：连续失败自动摘除，健康恢复后自动加回
        server app1:8080 max_fails=3 fail_timeout=10s;
        server app2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://seckill_app;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502;  # 实例挂了自动重试下一台
        }
    }
}
